<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flora</title>
    <link  rel="stylesheet" href="style.css">
</head>
<body>
    <div class="header">
        <div class = "container">
             <div class = "logo">Flora</div>
            <div class = "flor">
            <div class = "flor-item">Каталог</div>
            <div class = "flor-item">Доставка</div>
            <div class = "flor-item">Акции</div>
            <div class = "flor-item">Новинки</div>
            <div class = "flor-item">О нас</div>
            <div class = "flor-item">Контакты</div>
        </div>
           
    </div>
       
<!-- Основной контент -->
<div class="main">
    <div class="container">
        <!-- Баннер -->
        <div class="banner">
            <div class="banner-content">
                <h1>Добро пожаловать на наш сайт!</h1>
                <!-- h1 - Заголовок первого уровня (самый важный), еще есть h2,h3 и т.д -->
                <p>Лучшие букет по доступным ценам</p>
                <!-- p - абзац текста -->
                <button class="btn">Перейти к покупкам</button>
                <!-- button - специальный тег для кнопок -->
            </div>
        </div>

        <!-- Сетка товаров -->
        <div class="products-flex">
            <div class="product-card">
                <img src="цветы/images.jpg" alt="images" class="product-image">
                <div class="product-title">розы</div>
                <div class="product-price">от 2000 руб.</div>
            </div>
            
            <div class="product-card">
                <img src="цветы/пионы.jpg" alt="пионы" class="product-image">
                <div class="product-title">Пионы</div>
                <div class="product-price"> от 2500 руб.</div>
            </div>
            
            <div class="product-card">
                <img src="цветы/Гортензия.jpg" alt="Гортензия" class="product-image">
                <div class="product-title">Гортензия</div>
                <div class="product-price">от 3000 руб.</div>
            </div>
        </div>
    </div>
</div>

<!-- Подвал -->
<div class="footer">
    <div class="container">
        <div class="footer-content">
            <div class="copyright">© 2024 Flora. Все права защищены.</div>
            <div class="social-links">
                <div class="social-link">VK</div>
                <div class="social-link">Telegram</div>
                <div class="social-link">YouTube</div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
